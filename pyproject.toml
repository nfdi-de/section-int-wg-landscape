[build-system]
requires = ["uv_build>=0.12.5,<1.0"]
build-backend = "uv_build"

[project]
name = "nfdi-kg"
version = "0.0.1-dev"
description = "NFDI Knowledge Graph"
readme = "README.md"
authors = [
    { name = "Charles Tapley Hoyt", email = "cthoyt@gmail.com" }
]
maintainers = [
    { name = "Charles Tapley Hoyt", email = "cthoyt@gmail.com" }
]

# See https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#classifiers
# Search tags using the controlled vocabulary at https://pypi.org/classifiers
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
    "Framework :: tox",
    "Framework :: Sphinx",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
keywords = [
]

# License Information.
# See PEP-639 at https://peps.python.org/pep-0639/#add-license-files-key
license = "MIT"

requires-python = ">=3.14"
dependencies = [
    "pystow>=0.9.0",
    "pydantic>=2.0",
    "bioregistry>=0.14.1",
    "pyobo>=0.13.3",
    "wikidata-client",
    "curies>=0.15.0",
    "click",
    "pandas",
]
